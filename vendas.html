<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vendas - Loja de Jogos</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>Loja de Jogos</h1>
        <p>Registro de Vendas</p>
    </header>

    <nav menutpi2>
        <a href="index.html">Início</a>
        <a href="clientes.html">Clientes</a>
        <a href="funcionarios.html">Funcionários</a>
        <a href="fornecedores.html">Fornecedores</a>
        <a href="jogos.html">Jogos</a>
        <a href="vendas.html">Vendas</a>
    </nav>

    <main>

        <h2>Registrar Venda</h2>

        <form id="formVenda" method="post">

     <label for="cliente">Cliente:</label>
     <input type="text" id="cliente" name="cliente" required>

        <label for="funcionario">Funcionário:</label>
        <input type="text" id="funcionario" name="funcionario" required>

        <label for="jogo">Jogo:</label>
        <input type="text" id="jogo" name="jogo" required>

     <label for="quantidade">Quantidade:</label>
     <input type="number" id="quantidade" name="quantidade" min="1" required>

      <label for="preco">Preço do jogo:</label>
     <input type="number" id="preco" name="preco" step="0.01" min="0" required>

       <label for="pagamento">Forma de pagamento:</label>
      <select id="pagamento" name="pagamento" required>
        <option value="">Selecione</option>
        <option value="pix">Pix</option>
        <option value="cartao">Cartão</option>
        <option value="dinheiro">Dinheiro</option>
     </select>

     <button type="submit">Registrar Venda</button>

     </form>

        <br>

        <a href="index.html">← Voltar para o início</a>

    </main>

    <footer>
        <p>Projeto de Tecnologias para Internet II</p>
    </footer>

    <script src="js/script.js"></script>

</body>

</html>
